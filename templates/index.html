<html>
  <head>
    <title>{{ config.title }}</title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link href="{{ domain }}assets/css/kittens.css?v={{ version }}" type="text/css" rel="stylesheet">

    <meta name="theme-color" content="#d35400">
    <link rel="icon" type="image/x-icon" href="https://global.media.stuxapis.net/kittens/icon.png">
    <meta content="{{ config.description }}" name="description" />

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="StuxAPIs">
    <meta property="og:title" content="{{ config.title }}">
    <meta property="og:description" content="{{ config.description }}">
    <meta property="og:url" content="{{ domain }}">
    <meta property="og:image" content="https://global.media.stuxapis.net/kittens/icon.png">
    <meta property="og:image:width" content="512">
    <meta property="og:image:height" content="512">
    <meta property="og:image:alt" content="{{ config.title }} icon">

    <meta name="twitter:card" content="summary">
    <meta name="twitter:site" content="StuxAPIs">
    <meta name="twitter:title" content="{{ config.title }}">
    <meta name="twitter:description" content="{{ config.description }}">
    <meta name="twitter:url" content="{{ domain }}">
    <meta name="twitter:image" content="https://global.media.stuxapis.net/kittens/icon.png">
    <meta name="twitter:image:alt" content="{{ config.title }} icon">
  </head>
  <body>
    <section class="fullscreen">
      <div class="background" style="background-image: url('{{ background }}');"></div>
      <div class="center-object">
        <section class="me">
          <h1 class="title"><img src="https://global.media.stuxapis.net/kittens/logo.svg" alt="{{ config.title }}" class="logo-img"></h1>
          <span class="undertitle">
            <span class="tagline">{{ config.description }}</span>
            <br>
            <span class="subtext"><i>Built & Maintained by <a class="accent-text" href="https://stuxapis.net">StuxAPIs</a>, Hosted by <a class="accent-text" href="https://stuxedo.com">Stuxedo</a></i></span>
          </span>
        </section>
        <div class="buttons">
          <a href="random" class="btn animation accent-bg" target="_blank">Random Kitten</a>
          <a href="random.json" class="btn animation accent-bg" target="_blank">Random Kitten [ JSON ]</a>
        </div>
      </div>
      <footer class="site-footer">
        Images in API: <b class="accent-text">{{ images }}</b>
        <br>
        &copy; 2024-{{ year }} StuxAPIs &mdash; <a href="/changelog" style="color:inherit;">v{{ version }}</a>
        &middot; <a href="/legal" style="color:inherit;">Boring Legal Stuff</a>
        &middot; <a href="/about" style="color:inherit;">About</a>
        &middot; <a href="https://services.stuxapis.net" style="color:inherit;">A StuxAPIs Service</a>
      </footer>
    </section>
  </body>
</html>
