<html>
  <head>
    <title>{% block title %}Legal{% endblock %} - {{ config.title }}</title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no"/>
    <link href="{{ domain }}assets/css/kittens.css?v=1.0.0" type="text/css" rel="stylesheet">
    <meta name="theme-color" content="#d35400">
    <link rel="icon" type="image/x-icon" href="{{ domain }}assets/images/profile.png">
  </head>
  <body class="legal-body">
    <a class="legal-back" href="/legal">&larr; Back to Boring Legal Stuff</a>
    {% block content %}{% endblock %}
    <footer class="legal-footer">
      <p>Questions about any of this? Contact <a href="mailto:contact@stuxapis.net">contact@stuxapis.net</a>.</p>
      <p><a href="/">&larr; Back to {{ config.title }}</a></p>
    </footer>
  </body>
</html>
