<html>
  <head>
    <title>{% block title %}Legal - {{ config.title }}{% endblock %}</title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no"/>
    <link href="{{ domain }}assets/css/kittens.css?v={{ version }}" type="text/css" rel="stylesheet">
    <meta name="theme-color" content="#d35400">
    <link rel="icon" type="image/x-icon" href="https://global.media.stuxapis.net/kittens/icon.png">
  </head>
  <body class="legal-body">
    {% block backlink %}<a class="legal-back" href="/legal">&larr; Back to Boring Legal Stuff</a>{% endblock %}

      <p>Questions about any of this? Contact <a href="mailto:legal@stuxapis.net">legal@stuxapis.net</a>.</p>
      <p><a href="/">&larr; Back to {{ config.title }}</a> &middot; <a href="/about">About</a></p>
    </footer>
  </body>
