<html>
  <head>
    <title>{{ title }} - {{ config.title }}</title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no"/>
    {% if inline_css %}
    <style>{{ inline_css | safe }}</style>
    {% else %}
    <link href="{{ domain }}assets/css/kittens.css?v={{ version }}" type="text/css" rel="stylesheet">
    {% endif %}
    <meta name="theme-color" content="#d35400">
    <link rel="icon" type="image/x-icon" href="https://global.media.stuxapis.net/kittens/icon.png">
  </head>
  <body class="legal-body">
    <a class="legal-back" href="/">&larr; Back to {{ config.title }}</a>
    <h1>{{ code }}</h1>
    <p>{{ message }}</p>
    {% if code < 500 %}
    <p>Try <a href="/random">a random kitten</a> instead?</p>
    {% endif %}
    <footer class="legal-footer">
      <p><a href="/legal">Boring Legal Stuff</a> &middot; <a href="/changelog">Changelog</a></p>
    </footer>
  </body>
</html>
