# Kittens' own error pages for the errors nginx answers itself: Kittens down or restarting
# (502/503/504), or a request rejected before it reaches the app (400, 413). Everything else
# is rendered by the app (templates/404.html, 418.html and error.html).
#
# Install: include snippets/kittens-errors.conf; in each Kittens server block
# (kittens.stuxapis.net and kittensapi.stuxapis.net), pointing at the checkout's errors/ folder.
error_page 400 /__kittens_errors/400.html;
error_page 413 /__kittens_errors/413.html;
error_page 502 /__kittens_errors/502.html;
error_page 503 /__kittens_errors/503.html;
error_page 504 /__kittens_errors/504.html;
location ^~ /__kittens_errors/ {
	alias /home/stux/kittens/errors/;
	internal;
	add_header Cache-Control "no-store" always;
}
